<svg width="1440" height="900" viewBox="0 0 1440 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1440" height="900" fill="#F8FAFC"/>
  <rect x="64" y="48" width="1312" height="804" rx="28" fill="white" stroke="#E2E8F0" stroke-width="2"/>
  <text x="104" y="112" font-family="Arial, Microsoft YaHei, sans-serif" font-size="34" font-weight="700" fill="#0F172A">地理探究伴学智能体 MVP</text>
  <text x="104" y="154" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" fill="#475569">面向《虚拟地理环境实践教程》的课堂伴学演示版</text>
  <rect x="104" y="188" width="1232" height="64" rx="16" fill="#FFF7ED" stroke="#FED7AA"/>
  <text x="128" y="228" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" fill="#9A3412">知识库状态：教材《虚拟地理环境实践教程 0922版本.docx》｜片段数：自动生成｜Embedding 后端：sentence-transformers / OpenAI / TF-IDF</text>
  <rect x="104" y="292" width="220" height="54" rx="14" fill="#F97316"/>
  <text x="148" y="326" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="white">GIS 实验助教</text>
  <rect x="340" y="292" width="220" height="54" rx="14" fill="#F1F5F9"/>
  <text x="379" y="326" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" fill="#334155">问题建模助手</text>
  <rect x="576" y="292" width="180" height="54" rx="14" fill="#F1F5F9"/>
  <text x="630" y="326" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" fill="#334155">过程评价</text>
  <rect x="104" y="382" width="570" height="250" rx="18" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="132" y="424" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20" font-weight="700" fill="#0F172A">学生问题</text>
  <text x="132" y="470" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" fill="#64748B">PLUS 模型里如何提取 2010 到 2020 年土地扩张？</text>
  <rect x="132" y="548" width="160" height="48" rx="12" fill="#F97316"/>
  <text x="192" y="579" font-family="Arial, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="white">回答</text>
  <rect x="704" y="382" width="632" height="360" rx="18" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="732" y="424" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20" font-weight="700" fill="#0F172A">回答预览</text>
  <text x="732" y="470" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" fill="#334155">1. 先打开 PLUS 模型，进入 Extract Land Expansion 模块。</text>
  <text x="732" y="508" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" fill="#334155">2. 选择两期土地利用数据 LU10m_uc.tif 和 LU20m_uc.tif。</text>
  <text x="732" y="546" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" fill="#334155">3. 指定输出路径后运行，得到 2010—2020 年土地扩张图。</text>
  <text x="732" y="604" font-family="Arial, Microsoft YaHei, sans-serif" font-size="17" fill="#64748B">命中章节：1.6.2 提取土地扩张｜相关度 0.xxx</text>
  <rect x="104" y="680" width="570" height="62" rx="14" fill="#ECFDF5" stroke="#BBF7D0"/>
  <text x="132" y="719" font-family="Arial, Microsoft YaHei, sans-serif" font-size="17" fill="#166534">演示重点：先检索教材，再由 GPT-4o 组织成学生能执行的步骤。</text>
</svg>
